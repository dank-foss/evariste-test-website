<!doctype html>
<html>
  <head>
    <title>{{ .Title }}</title>
    <script>
      MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
        },
      };
    </script>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"
    ></script>
  </head>
  <body>
    {{ partial "navbar.html" . }}
    <h1>{{.Title}}</h1>
    {{ .Content }}
  </body>
</html>
